<button
  (click)="toggle()"
  class="fixed bottom-6 right-6 z-50 w-12 h-12 bg-white text-slate-800 rounded-xl shadow-lg hover:shadow-xl active:scale-95 transition-all flex items-center justify-center border border-[var(--color-border-subtle)]"
  [class.rotate-45]="open()"
  [class.bg-white]="!open()"
  [class.!bg-[var(--color-sidebar)]]="open()"
  [class.!text-white]="open()"
>
  @if (!open()) {
    <svg class="w-5 h-5" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
  }
  @if (open()) {
        <svg class="w-5 h-5" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
  }
</button>

@if (open()) {
  <div class="fixed bottom-24 right-6 z-50 w-[360px] max-sm:w-[calc(100vw-3rem)] h-[560px] max-sm:h-[calc(100vh-8rem)] bg-white rounded-xl shadow-2xl border border-[var(--color-border-subtle)] flex flex-col overflow-hidden animate-slide-up">
    <div class="bg-slate-900 px-4 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-7 h-7 bg-blue-500 rounded-lg flex items-center justify-center">
          <svg class="w-4 h-4 text-white" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        </div>
        <div>
          <p class="text-sm font-medium text-white">B2B Assistant</p>
          <p class="text-[10px] text-slate-400 flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
            Online
          </p>
        </div>
      </div>
      <button (click)="toggle()" class="w-7 h-7 flex items-center justify-center rounded hover:bg-slate-800 transition-colors text-slate-400 hover:text-white">
        <svg class="w-4 h-4" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <div #chatContainer class="flex-1 overflow-y-auto px-4 py-4 space-y-3 bg-slate-50/50">
      @if (agent.messages().length === 0) {
        <div class="flex flex-col items-center justify-center h-full text-center px-6">
          <div class="w-12 h-12 bg-slate-100 rounded-xl flex items-center justify-center mb-3">
            <svg class="w-6 h-6 text-slate-400" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          </div>
          <p class="text-sm font-medium text-slate-700">How can I help you?</p>
          <p class="text-xs text-slate-400 mt-1 leading-relaxed">Ask me to check order status or create a new order.</p>
          <div class="mt-4 space-y-2 w-full">
            <button (click)="quickAction('Check status of ORD-001')" class="w-full text-left text-xs bg-white border border-slate-200 rounded-lg px-3 py-2.5 text-slate-600 hover:border-blue-300 hover:text-blue-600 transition-colors">Check status of ORD-001</button>
            <button (click)="quickAction('Create an order for ACC-001 with 10 BRK-001 and 20 FLT-001')" class="w-full text-left text-xs bg-white border border-slate-200 rounded-lg px-3 py-2.5 text-slate-600 hover:border-blue-300 hover:text-blue-600 transition-colors">Order 10 brake pads (BRK-001) for ACC-001</button>
          </div>
        </div>
      }

      @for (msg of agent.messages(); track $index) {
        <div class="flex {{ msg.role === 'user' ? 'justify-end' : 'justify-start' }}">
          @if (msg.role !== 'user') {
            <div class="w-6 h-6 bg-slate-100 rounded-full flex items-center justify-center mr-2 mt-0.5 shrink-0">
              <svg class="w-3.5 h-3.5 text-slate-500" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            </div>
          }
          <div
            class="max-w-[80%] rounded-lg px-3.5 py-2.5 text-sm leading-relaxed whitespace-pre-line"
            [class.bg-blue-600]="msg.role === 'user'"
            [class.text-white]="msg.role === 'user'"
            [class.bg-white]="msg.role !== 'user'"
            [class.text-slate-700]="msg.role !== 'user'"
            [class.border]="msg.role !== 'user'"
            [class.border-slate-200]="msg.role !== 'user'"
            [class.shadow-sm]="msg.role !== 'user'"
          >
            {{ msg.content }}
          </div>
        </div>
      }

      @if (agent.processing()) {
        <div class="flex justify-start">
          <div class="w-6 h-6 bg-slate-100 rounded-full flex items-center justify-center mr-2 mt-0.5 shrink-0">
            <svg class="w-3.5 h-3.5 text-slate-500" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          </div>
          <div class="bg-white border border-slate-200 rounded-lg px-4 py-3 shadow-sm">
            <div class="flex gap-1.5">
              <span class="w-1.5 h-1.5 bg-slate-300 rounded-full animate-bounce" style="animation-delay:0ms"></span>
              <span class="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce" style="animation-delay:150ms"></span>
              <span class="w-1.5 h-1.5 bg-slate-500 rounded-full animate-bounce" style="animation-delay:300ms"></span>
            </div>
          </div>
        </div>
      }
    </div>

    <div class="border-t border-slate-200 px-4 py-3 bg-white">
      <div class="flex gap-2">
        <input
          [value]="inputText()"
          (input)="inputText.set($any($event.target).value)"
          (keydown.enter)="send()"
          placeholder="Type a message..."
          class="flex-1 border border-slate-300 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 placeholder-slate-400"
          [disabled]="agent.processing()"
        />
        <button
          (click)="send()"
          [disabled]="agent.processing() || !inputText().trim()"
          class="bg-slate-900 text-white px-3.5 py-2 rounded-lg hover:bg-slate-800 transition-colors disabled:opacity-50 disabled:cursor-not-allowed text-sm font-medium"
        >
          <svg class="w-4 h-4" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19V5m0 0l-7 7m7-7l7 7"/></svg>
        </button>
      </div>
    </div>
  </div>
}
