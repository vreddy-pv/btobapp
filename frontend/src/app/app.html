<div class="min-h-screen bg-slate-50 flex">
  <aside class="w-64 bg-slate-900 min-h-screen flex flex-col shrink-0">

        <svg class="w-2.5 h-2.5 shrink-0" width="10" height="10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>

        <div class="text-sm text-slate-300 min-w-0">
          <p class="font-medium truncate">Demo User</p>
          <p class="text-xs text-slate-500 truncate">admin@btob.com</p>
        </div>

  <div class="flex-1 flex flex-col min-h-screen">
    <router-outlet />
