<div class="min-h-screen bg-[var(--color-surface)] flex">
  <aside class="w-64 bg-[var(--color-sidebar)] min-h-screen flex flex-col shrink-0">
    <div class="px-5 h-14 flex items-center border-b border-white/5">
      <div class="flex items-center gap-2.5">
        <div class="w-5 h-5 bg-white rounded flex items-center justify-center">
          <svg class="w-2.5 h-2.5 text-[var(--color-sidebar)]" width="10" height="10" fill="currentColor" viewBox="0 0 20 20"><path d="M11.17 2.97a1.75 1.75 0 0 0-2.34 0l-7 6.09A1.25 1.25 0 0 0 3 11.25H4v4.5c0 .69.56 1.25 1.25 1.25h9.5c.69 0 1.25-.56 1.25-1.25v-4.5h1a1.25 1.25 0 0 0 .83-2.19l-6.66-5.79Z"/></svg>
        </div>
        <div>
          <p class="text-sm font-bold text-white/90 leading-tight tracking-tight">BTB</p>
          <p class="text-[10px] text-white/40 leading-tight tracking-wide">AUTO PARTS</p>
        </div>
      </div>
    </div>
    <nav class="flex-1 px-2.5 py-3 space-y-0.5">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-white/50 hover:text-white hover:bg-[var(--color-sidebar-hover)] transition-all duration-150">
        <svg class="w-4 h-4 shrink-0" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        Dashboard
      </a>
      <a routerLink="/catalog" routerLinkActive="active" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-white/50 hover:text-white hover:bg-[var(--color-sidebar-hover)] transition-all duration-150">
        <svg class="w-4 h-4 shrink-0" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
        Catalog
      </a>
      <a routerLink="/orders" routerLinkActive="active" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-white/50 hover:text-white hover:bg-[var(--color-sidebar-hover)] transition-all duration-150">
        <svg class="w-4 h-4 shrink-0" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        Orders
      </a>
      <a routerLink="/accounts" routerLinkActive="active" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-white/50 hover:text-white hover:bg-[var(--color-sidebar-hover)] transition-all duration-150">
        <svg class="w-4 h-4 shrink-0" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        Accounts
      </a>
    </nav>
    <div class="px-2.5 py-3 border-t border-white/5">
      <div class="flex items-center gap-2.5 px-3 py-2">
        <div class="w-7 h-7 rounded-full bg-gradient-to-br from-blue-400 to-blue-600 flex items-center justify-center text-[11px] font-bold text-white shrink-0">DM</div>
        <div class="text-sm min-w-0">
          <p class="font-medium text-white/70 truncate leading-tight">Demo User</p>
          <p class="text-[11px] text-white/30 truncate leading-tight mt-0.5">admin@btob.com</p>
        </div>
      </div>
    </div>
  </aside>
  <div class="flex-1 flex flex-col min-h-screen">
    <router-outlet />
  </div>
</div>
<app-chat />
